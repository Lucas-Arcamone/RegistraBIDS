cat > pyproject.toml << EOF
[project]
name = "registrabids"
version = "0.1.0"
description = "BIDS registration pipeline"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "nibabel",
    "pybids",
    "click"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
EOF